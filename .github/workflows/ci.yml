name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build
        run: javac SiteGen.java

      - name: Download JUnit
        run: curl -sSLo junit.jar https://repo1.maven.org/maven2/org/junit/platform/junit-platform-console-standalone/1.10.2/junit-platform-console-standalone-1.10.2.jar

      - name: Test
        run: |
          javac -cp junit.jar SiteGenTest.java SiteGen.java
          java -jar junit.jar execute -cp . -c SiteGenTest

      - name: Generate site
        run: java SiteGen

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: public
